<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Admin · Sistema de Roles - DinoKing Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../assets/imgs/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/normalize.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script src="../services/api.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/admin.js" defer></script>
</head>

<body>
    <div id="header-container"></div>

    <main class="admin-roles-wrap">
        <div class="admin-card">
            <div class="header">
                <h1>Panel de Administración</h1>
            </div>
            <div class="content">
                <div id="admin-user-list" class="admin_user_list"></div>

                <div class="role-selection">
                    <h3 class="text-center">Selecciona un nuevo rol:</h3>
                    <div class="roles">
                        <div class="role-option" data-role="superadmin"><i>🛡️</i>
                            <div>Crear</div>
                        </div>
                        <div class="role-option" data-role="admin"><i>👑</i>
                            <div>Eliminar</div>
                        </div>
                        <div class="role-option" data-role="user"><i>👤</i>
                            <div>Editar</div>
                        </div>
                        <div class="role-option" data-role="user"><i>👤</i>
                            <div>Rol</div>
                        </div>
                    </div>
                </div>

                <button class="btn" id="change-role-btn">
                    <span id="btn-text">Cambiar Rol</span>
                    <span id="btn-loading" class="loading" style="display:none;"></span>
                </button>

                <div class="message" id="message"></div>

                <div class="history">
                    <h3 class="text-center">Historial de cambios</h3>
                    <div id="history-container"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <div id="modals-container"></div>

    <script>
        // Set up admin user info from session
        window.ADMIN_USER_ID = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadComponent('header-container', '../components/header_simple.html');
            await loadComponent('footer-container', '../components/footer.html');
            await loadComponent('modals-container', '../components/auth-modals.html');
            
            // Get user session and update admin info
            if (typeof window.API !== 'undefined') {
                try {
                    const session = await window.API.auth.getSession();
                    if (session && session.user) {
                        window.ADMIN_USER_ID = session.user.id || 1;
                        
                        // Check if user has admin permissions
                        const isAdmin = session.user.rol && ['admin', 'superadmin'].includes(session.user.rol);
                        if (!isAdmin) {
                            alert('No tienes permisos para acceder a esta página.');
                            window.location.href = '../index.html';
                        }
                    } else {
                        alert('Debes iniciar sesión para acceder a esta página.');
                        window.location.href = '../index.html';
                    }
                } catch (error) {
                    console.error('Error checking session:', error);
                    alert('Debes iniciar sesión para acceder a esta página.');
                    window.location.href = '../index.html';
                }
            }
        });

        async function loadComponent(containerId, componentPath) {
            try {
                const response = await fetch(componentPath);
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading component ${componentPath}:`, error);
            }
        }
    </script>
</body>
</html>
